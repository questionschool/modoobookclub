<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>출석 기록 — 뉴런하우스</title><link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="journal18.css"><script defer src="journal18-api.js"></script><script defer src="journal18-admin.js"></script></head><body><header class="top"><a href="journal_18.html">← 모두의 기록</a><span>시즌 18 · 관리자</span></header><main class="admin-wrap"><p class="eyebrow">TOGETHER AT DAWN</p><h1>함께 읽어 온 날들</h1><p class="admin-intro">낭독 구간과 함께한 사람들을 한눈에 살펴봐.<br>출석과 운영 메모는 관리자만 볼 수 있어.</p><form id="login"><label>관리자 비밀번호<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">관리자 로그인</button></form><p id="admin-status" class="admin-status" role="status"></p><section id="dashboard" hidden><details id="day-editor" open><summary>오늘 하루 기록 입력</summary><div class="admin-toolbar"><div class="date-controls"><button id="prev" aria-label="하루 전">←</button><label>출석 날짜<input type="date" min="2026-11-02" max="2026-11-30" id="admin-date" required></label><button id="next" aria-label="하루 뒤">→</button></div><button id="logout" class="text-button">로그아웃</button></div><p id="attendance-count"></p><form id="attendance-form"><div class="reading-fields"><div class="page-fields"><label>시작 쪽<input id="page-start" type="number" min="1" max="10000" placeholder="선택"></label><label>끝 쪽<input id="page-end" type="number" min="1" max="10000" placeholder="선택"></label></div><output id="page-count-display" class="admin-status" aria-live="polite"></output><p class="admin-status">시작 쪽과 끝 쪽을 넣으면 읽은 쪽수를 자동으로 계산해.</p></div><div id="attendance-list" class="attendance-list"></div><p><button type="button" id="select-all" class="text-button">모두 선택</button> · <button type="button" id="select-none" class="text-button">모두 해제</button></p><label for="admin-note">오늘의 운영 메모 <small>선택 · 관리자만 볼 수 있어</small></label><textarea id="admin-note" maxlength="5000" rows="4" placeholder="오늘 함께한 시간에서 기억해 둘 일이 있다면 남겨 줘."></textarea><div class="admin-footer"><span id="saved-at" class="admin-status"></span><button id="save-attendance" type="submit" class="primary">출석 기록 저장</button></div></form></details><section class="attendance-overview" aria-labelledby="overview-title"><div class="overview-head"><div><p class="eyebrow">SEASON 18 · ATTENDANCE</p><h2 id="overview-title">시즌 전체 출석 기록</h2></div><button id="refresh-overview" type="button" class="text-button">새로 불러오기 ↻</button></div><p class="admin-status">11월 2일–30일 평일 21회 예정이야. 미기록은 결석이 아니야.<br>회차를 누르면 낭독 구간과 출석을 남기거나 고칠 수 있어.</p><p id="overview-summary" role="status"></p><div id="attendance-overview-list"></div></section></section></main></body></html>
