<script>
// ════════════════════════════════════════════════════════
// 설정
// ════════════════════════════════════════════════════════
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyN5Gzjrzvf_hnewWGnFdeQpl0YpSbcR8aRsW8BGQbOsd2_ajsuAkwD228JwyccQj1h/exec';
const WEEKDAYS = ['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];
const SECTION_LABELS = { front: '서론', main: '본문', back: '후기' };

const BOOK_AUTHOR = '얄롬';
const BOOK_TITLE = '마음의 시간 : 여기 그리고 지금과 연결되기';

const DEFAULT_MEMBERS = [
  '농담', '마성', '목마가렛', '밝은열정', '보나',
  '여운', '연경', '자연', '자유', '지평', '프란체스코'
];

// ════════════════════════════════════════════════════════
// 상태
// ════════════════════════════════════════════════════════
let allSessions = [];
let memberCounts = {};   // alias → 기록 수
let selectedAlias = null;

// ════════════════════════════════════════════════════════
// 진입점
// ════════════════════════════════════════════════════════
async function init() {
  if (!GAS_URL || GAS_URL.startsWith('PASTE_')) {
    document.getElementById('memberGrid').innerHTML = `
      <span class="empty-state" style="padding: 16px;">
        ⚙️ Google Apps Script 연동이 필요해.
      </span>`;
    renderMembers(DEFAULT_MEMBERS, {});
    return;
  }

  try {
    const res = await fetch(`${GAS_URL}?action=list_all`);
    const data = await res.json();
    allSessions = data.sessions || [];
    const members = (data.members && data.members.length) ? data.members : DEFAULT_MEMBERS;

    // 멤버별 기록 수 계산 (시즌 멤버 외 사람도 포함)
    const counts = {};
    const allAliases = new Set(members);
    allSessions.forEach(s => {
      (s.reflections || []).forEach(r => {
        if (r.alias) {
          counts[r.alias] = (counts[r.alias] || 0) + 1;
          allAliases.add(r.alias);
        }
      });
    });
    memberCounts = counts;

    // 멤버는 시즌 멤버 먼저(가나다 순), 그 외 사람은 뒤에
    const seasonSet = new Set(members);
    const extras = [...allAliases].filter(a => !seasonSet.has(a)).sort();
    renderMembers([...members, ...extras], counts);

    // URL로 들어왔으면 선택
    const params = new URLSearchParams(location.search);
    const aliasParam = params.get('alias');
    if (aliasParam) {
      selectMember(aliasParam);
    } else {
      // localStorage에 저장된 본인 별칭 있으면 자동
      const saved = localStorage.getItem('journal15_alias');
      if (saved && allAliases.has(saved)) {
        selectMember(saved);
      }
    }
  } catch (err) {
    console.error(err);
    document.getElementById('memberGrid').innerHTML = `
      <span class="empty-state" style="padding: 16px;">불러오기 실패.</span>`;
    renderMembers(DEFAULT_MEMBERS, {});
  }
}

// ════════════════════════════════════════════════════════
// 멤버 그리드
// ════════════════════════════════════════════════════════
function renderMembers(list, counts) {
  const el = document.getElementById('memberGrid');
  el.innerHTML = list.map(alias => {
    const count = counts[alias] || 0;
    return `
      <a class="member-pill ${alias === selectedAlias ? 'current' : ''}"
         href="?alias=${encodeURIComponent(alias)}"
         onclick="selectMember('${escapeAttr(alias)}'); return false;">
        ${escapeHtml(alias)}
        ${count > 0 ? `<span class="count">${count}</span>` : ''}
      </a>
    `;
  }).join('');
}

// ════════════════════════════════════════════════════════
// 멤버 선택
// ════════════════════════════════════════════════════════
function selectMember(alias) {
  selectedAlias = alias;

  // URL 업데이트 (브라우저 히스토리)
  const newUrl = `${location.pathname}?alias=${encodeURIComponent(alias)}`;
  history.replaceState(null, '', newUrl);

  // 멤버 그리드 강조 갱신
  document.querySelectorAll('.member-pill').forEach(p => {
    p.classList.remove('current');
    if (decodeURIComponent(p.getAttribute('href').replace('?alias=', '')) === alias) {
      p.classList.add('current');
    }
  });

  renderSelected();
}

// ════════════════════════════════════════════════════════
// 선택된 멤버의 기록
// ════════════════════════════════════════════════════════
function renderSelected() {
  const view = document.getElementById('selectedView');
  view.style.display = 'block';
  document.getElementById('selectedName').textContent = selectedAlias;

  // allSessions에서 해당 별칭이 남긴 모든 기록 추출
  const entries = [];
  let attendanceCount = 0;
  let firstDate = null;

  allSessions.forEach(s => {
    // 참석 카운트
    if ((s.attendees || []).some(a => a.alias === selectedAlias)) {
      attendanceCount++;
      if (!firstDate || (s.date && new Date(s.date) < new Date(firstDate))) {
        firstDate = s.date;
      }
    }

    // 기록
    (s.reflections || []).forEach(r => {
      if (r.alias === selectedAlias) {
        entries.push({
          ...r,
          day: s.day,
          date: s.date,
          section: s.section,
          start_page: s.start_page,
          end_page: s.end_page
        });
      }
    });
  });

  // 최근 회차가 위로
  entries.sort((a, b) => (Number(b.day) || 0) - (Number(a.day) || 0));

  // 메타
  const metaParts = [];
  metaParts.push(`기록 ${entries.length}개`);
  if (attendanceCount > 0) metaParts.push(`참석 ${attendanceCount}회`);
  document.getElementById('selectedMeta').textContent = metaParts.join(' · ');

  // 다운로드 버튼: 기록이 1개 이상일 때만 표시
  const dlBtn = document.getElementById('memberDownloadBtn');
  if (dlBtn) {
    dlBtn.style.display = entries.length > 0 ? 'inline-flex' : 'none';
  }
  // entries를 함수 밖에서 접근 가능하게 전역에 저장
  window._currentMemberEntries = entries;

  // 엔트리 렌더
  const listEl = document.getElementById('entriesList');
  if (entries.length === 0) {
    listEl.innerHTML = `
      <div class="empty-state">
        <strong>${escapeHtml(selectedAlias)}</strong>
        아직 ${escapeHtml(selectedAlias)}이(가) 남긴 기록이 없어.<br>
        <a href="journal_15.html" style="color: var(--accent); border-bottom: 1px solid var(--accent);">일지 페이지로 가서 첫 한 줄 남기기 →</a>
      </div>`;
    return;
  }

  listEl.innerHTML = entries.map(e => renderEntry(e)).join('');
}

function renderEntry(e) {
  const dateInfo = formatSessionDate(e.date);
  const section = SECTION_LABELS[e.section] || '';

  return `
    <article class="entry">
      <div class="entry-head">
        <div>
          <div class="entry-day">
            <a href="journal_15.html#session-${e.day}">Day ${escapeHtml(e.day)}</a>
          </div>
          <div class="entry-date">${dateInfo.date} ${dateInfo.weekday}</div>
        </div>
        <div class="entry-pages">
          ${section ? `${section} · ` : ''}p. ${escapeHtml(e.start_page)} → ${escapeHtml(e.end_page || '?')}
        </div>
      </div>

      ${e.quote_text ? `
        <div>
          <span class="entry-quote-label">📜 마음에 남은 문장</span>
          <div class="entry-quote">
            <div class="entry-quote-text">${escapeHtml(e.quote_text)}</div>
            <div class="entry-quote-source">
              — ${escapeHtml(BOOK_AUTHOR)} 『${escapeHtml(BOOK_TITLE)}』${e.quote_page ? ` · p. ${escapeHtml(e.quote_page)}` : ''}
            </div>
          </div>
        </div>` : ''}

      ${e.my_mind ? `
        <div>
          <span class="entry-mind-label">✿ 남기고 싶은 나의 마음</span>
          <div class="entry-mind">${escapeHtml(e.my_mind)}</div>
        </div>` : ''}
    </article>
  `;
}

// ════════════════════════════════════════════════════════
// 유틸
// ════════════════════════════════════════════════════════
function formatSessionDate(iso) {
  if (!iso) return { date: '', weekday: '' };
  const d = new Date(iso);
  if (isNaN(d.getTime())) return { date: String(iso), weekday: '' };
  return {
    date: `${d.getMonth() + 1}월 ${d.getDate()}일`,
    weekday: WEEKDAYS[d.getDay()]
  };
}

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function escapeAttr(s) {
  return escapeHtml(s).replace(/'/g, '\\\'');
}

// ════════════════════════════════════════════════════════
// 다운로드 — 멤버 기록 전체를 PDF로
// ════════════════════════════════════════════════════════

function buildPrintableMemberPage(alias, entries) {
  const entriesHtml = entries.map(e => {
    const dateInfo = formatSessionDate(e.date);
    const section = SECTION_LABELS[e.section] || '';
    const pageRange = e.end_page ? `p. ${e.start_page} ~ p. ${e.end_page}` : `p. ${e.start_page}`;

    let html = '<div style="background: #fafaf8; border: 1px solid #e5dcc8; border-left: 3px solid #b08a4a; padding: 22px 26px; border-radius: 2px; margin-bottom: 24px; page-break-inside: avoid;">';

    // 헤더
    html += '<div style="display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 12px; margin-bottom: 16px; border-bottom: 1px dashed #d4c8b3; flex-wrap: wrap;">';
    html += `<div><div style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 13px; letter-spacing: 0.2em; color: #8a6b35; text-transform: uppercase;">Day ${escapeHtml(e.day)}</div>`;
    html += `<div style="font-family: 'Gowun Batang', serif; font-size: 14px; color: #4a423a; margin-top: 2px;">${dateInfo.date} ${dateInfo.weekday}</div></div>`;

    html += '</div>';

    // 인용
    if (e.quote_text) {
      html += '<div style="margin-bottom: 14px;">';
      html += '<div style="font-family: \'Cormorant Garamond\', serif; font-style: italic; font-size: 11px; letter-spacing: 0.18em; color: #8a6b35; text-transform: uppercase; margin-bottom: 8px;">📜 마음에 남은 문장</div>';
      html += '<div style="padding: 14px 18px; background: #fafaf8; border-left: 2px solid #d4b97e;">';
      html += `<div style="font-family: 'Nanum Myeongjo', serif; font-size: 15px; line-height: 1.9; color: #2a2520; font-style: italic; padding-left: 14px; white-space: pre-wrap; word-break: keep-all;">${escapeHtml(e.quote_text)}</div>`;
      html += `<div style="margin-top: 10px; padding-top: 8px; padding-left: 14px; border-top: 1px dotted rgba(176,138,74,0.25); font-family: 'Gowun Batang', serif; font-size: 11.5px; color: #6b6258; text-align: right; line-height: 1.5; word-break: keep-all;">— ${escapeHtml(BOOK_AUTHOR)} 『${escapeHtml(BOOK_TITLE)}』${e.quote_page ? ' · p. ' + escapeHtml(e.quote_page) : ''}</div>`;
      html += '</div></div>';
    }

    // 마음
    if (e.my_mind) {
      html += '<div>';
      html += '<div style="font-family: \'Cormorant Garamond\', serif; font-style: italic; font-size: 11px; letter-spacing: 0.18em; color: #8a6b35; text-transform: uppercase; margin-bottom: 8px;">✿ 남기고 싶은 나의 마음</div>';
      html += `<div style="font-family: 'Gowun Batang', serif; font-size: 14.5px; line-height: 1.9; color: #4a423a; padding: 12px 16px; background: #fafaf8; border-radius: 2px; border-left: 2px solid #a55c47; white-space: pre-wrap; word-break: keep-all;">${escapeHtml(e.my_mind)}</div>`;
      html += '</div>';
    }

    html += '</div>';
    return html;
  }).join('');

  return `
    <div style="font-family: 'Noto Serif KR', 'Gowun Batang', serif; background: #ffffff; padding: 50px 56px; max-width: 700px; box-sizing: border-box; color: #2a2520; line-height: 1.7;">
      <!-- 헤더 -->
      <div style="text-align: center; padding-bottom: 24px; margin-bottom: 32px; border-bottom: 1px solid #d4c8b3;">
        <div style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 12px; letter-spacing: 0.25em; color: #8a6b35; text-transform: uppercase; margin-bottom: 12px;">HOUR OF THE HEART</div>
        <div style="font-family: 'Nanum Myeongjo', serif; font-weight: 800; font-size: 28px; color: #7a3f2e; margin-bottom: 8px;">마음의 시간</div>
        <div style="font-family: 'Nanum Myeongjo', serif; font-size: 17px; color: #2a2520; margin-bottom: 14px;"><span style="color: #7a3f2e; font-weight: 700;">${escapeHtml(alias)}</span>의 독서와 마음 기록</div>
        <div style="font-family: 'Nanum Myeongjo', serif; font-size: 13px; color: #6b6258; margin-bottom: 2px;">여기 그리고 지금과 연결하기</div>
        <div style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 13px; color: #6b6258;">Connection in the Here and Now</div>
        <div style="font-family: 'Gowun Batang', serif; font-size: 12px; color: #6b6258; margin-top: 14px;">책과 마음 읽기 ${entries.length}개</div>
      </div>

      <!-- 엔트리 -->
      ${entriesHtml}

      <!-- 워터마크 -->
      <div style="margin-top: 32px; padding-top: 20px; border-top: 1px solid #d4c8b3; text-align: center;">
        <div style="font-family: 'Cormorant Garamond', serif; font-style: italic; letter-spacing: 0.25em; color: #8a6b35; font-size: 11px; margin-bottom: 6px;">READING · ALOUD · TOGETHER</div>
        <div style="font-family: 'Gowun Batang', serif; font-size: 11px; color: #6b6258;">모두의 새벽 + 낭만북클럽 · 시즌 15 『마음의 시간』</div>
        <div style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 10px; color: #9a9085; margin-top: 4px;">bookclub.questionschool.net</div>
      </div>
    </div>
  `;
}

async function captureElement(html) {
  const wrapper = document.createElement('div');
  wrapper.style.position = 'fixed';
  wrapper.style.left = '-9999px';
  wrapper.style.top = '0';
  wrapper.style.width = '700px';
  wrapper.innerHTML = html;
  document.body.appendChild(wrapper);

  if (document.fonts && document.fonts.ready) {
    try { await document.fonts.ready; } catch (e) {}
  }
  await new Promise(r => setTimeout(r, 200));

  const canvas = await html2canvas(wrapper.firstElementChild, {
    scale: 2,
    backgroundColor: '#ffffff',
    logging: false,
    useCORS: true
  });

  document.body.removeChild(wrapper);
  return canvas;
}

async function downloadMemberPdf() {
  const entries = window._currentMemberEntries || [];
  if (entries.length === 0 || !selectedAlias) {
    alert('아직 기록이 없어.');
    return;
  }

  const btn = document.getElementById('memberDownloadBtn');
  const originalHtml = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span>⏳</span><span>PDF 만드는 중…</span>';

  try {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    const pageHeightMm = 297;
    const imgWidthMm = 210;

    const html = buildPrintableMemberPage(selectedAlias, entries);
    const canvas = await captureElement(html);

    const imgData = canvas.toDataURL('image/jpeg', 0.92);
    const imgHeightMm = (canvas.height * imgWidthMm) / canvas.width;

    if (imgHeightMm <= pageHeightMm) {
      pdf.addImage(imgData, 'JPEG', 0, 0, imgWidthMm, imgHeightMm);
    } else {
      // 긴 컨텐츠를 여러 페이지로 분할
      let yOffset = 0;
      while (yOffset < imgHeightMm) {
        if (yOffset > 0) pdf.addPage();
        pdf.addImage(imgData, 'JPEG', 0, -yOffset, imgWidthMm, imgHeightMm);
        yOffset += pageHeightMm;
      }
    }

    const today = getTodayStr();
    pdf.save(`마음의시간_${selectedAlias}_기록_${today}.pdf`);
  } catch (err) {
    console.error(err);
    alert('PDF 저장 실패: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = originalHtml;
  }
}

function getTodayStr() {
  const d = new Date();
  return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
}
