<script>
// ════════════════════════════════════════════════════════
// 설정
// ════════════════════════════════════════════════════════
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyN5Gzjrzvf_hnewWGnFdeQpl0YpSbcR8aRsW8BGQbOsd2_ajsuAkwD228JwyccQj1h/exec';
const WEEKDAYS = ['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];
const SECTION_LABELS = { front: '서론', main: '본문', back: '후기' };

const BOOK_AUTHOR = '위화';
const BOOK_TITLE = '원청 (文城)';

// 시즌 17 참가자 (가나다 순) — 농담 첫째 · 지평 마지막
const DEFAULT_MEMBERS = [
  '농담', '농부', '라일락', '마성', '목마가렛',
  '보나', '연경', '자연', '자유', '지평'
];

// ════════════════════════════════════════════════════════
// 상태
// ════════════════════════════════════════════════════════
let allSessions = [];
let contents = [];
let memberCounts = {};   // alias → 기록 수
let selectedAlias = null;
let currentSort = 'newest';  // 'newest' (최근부터, 기본) | 'oldest' (오래된 것부터)

// ════════════════════════════════════════════════════════
// 진입점
// ════════════════════════════════════════════════════════
async function init() {
  if (!GAS_URL || GAS_URL.startsWith('PASTE_')) {
    document.getElementById('memberGrid').innerHTML = `
      <span class="empty-state" style="padding: 16px;">
        ⚙️ Google Apps Script 연동이 필요해.
      </span>`;
    renderMembers(DEFAULT_MEMBERS, {});
    return;
  }

  try {
    const [sessionsRes, contentsRes] = await Promise.all([
      fetch(`${GAS_URL}?action=list_all&season=17`),
      fetch(`${GAS_URL}?action=list_contents&season=17`)
    ]);
    const data = await sessionsRes.json();
    const contentsData = await contentsRes.json();
    allSessions = data.sessions || [];
    contents = contentsData.contents || [];
    const members = (data.members && data.members.length) ? data.members : DEFAULT_MEMBERS;

    // 멤버별 기록 수 계산 (시즌 멤버 외 사람도 포함)
    const counts = {};
    const allAliases = new Set(members);
    allSessions.forEach(s => {
      (s.reflections || []).forEach(r => {
        if (r.alias) {
          counts[r.alias] = (counts[r.alias] || 0) + 1;
          allAliases.add(r.alias);
        }
      });
    });
    memberCounts = counts;

    // 멤버는 시즌 멤버 먼저(가나다 순), 그 외 사람은 뒤에
    const seasonSet = new Set(members);
    const extras = [...allAliases].filter(a => !seasonSet.has(a)).sort();
    renderMembers([...members, ...extras], counts);

    // URL로 들어왔으면 선택
    const params = new URLSearchParams(location.search);
    const aliasParam = params.get('alias');
    if (aliasParam) {
      selectMember(aliasParam);
    } else {
      // localStorage에 저장된 본인 별칭 있으면 자동
      const saved = localStorage.getItem('journal17_alias');
      if (saved && allAliases.has(saved)) {
        selectMember(saved);
      }
    }
  } catch (err) {
    console.error(err);
    document.getElementById('memberGrid').innerHTML = `
      <span class="empty-state" style="padding: 16px;">불러오기 실패.</span>`;
    renderMembers(DEFAULT_MEMBERS, {});
  }
}

function renderMembers(list, counts) {
  const el = document.getElementById('memberGrid');
  el.innerHTML = list.map(alias => {
    const count = counts[alias] || 0;
    return `
      <a class="member-pill ${alias === selectedAlias ? 'current' : ''}"
         href="?alias=${encodeURIComponent(alias)}"
         onclick="selectMember('${escapeAttr(alias)}'); return false;">
        ${escapeHtml(alias)}
        ${count > 0 ? `<span class="count">${count}</span>` : ''}
      </a>
    `;
  }).join('');
}

// ════════════════════════════════════════════════════════
// 멤버 선택
// ════════════════════════════════════════════════════════
function selectMember(alias) {
  selectedAlias = alias;

  // URL 업데이트 (브라우저 히스토리)
  const newUrl = `${location.pathname}?alias=${encodeURIComponent(alias)}`;
  history.replaceState(null, '', newUrl);

  // 멤버 그리드 강조 갱신
  document.querySelectorAll('.member-pill').forEach(p => {
    p.classList.remove('current');
    if (decodeURIComponent(p.getAttribute('href').replace('?alias=', '')) === alias) {
      p.classList.add('current');
    }
  });

  renderSelected();
}

// 정렬 토글
function changeSort(direction) {
  if (currentSort === direction) return;
  currentSort = direction;
  renderSelected();
}

// 선택된 멤버의 기록
// ════════════════════════════════════════════════════════
function renderSelected() {
  const view = document.getElementById('selectedView');
  view.style.display = 'block';
  document.getElementById('selectedName').textContent = selectedAlias;

  // allSessions에서 해당 별칭이 남긴 모든 기록 추출
  const entries = [];
  let attendanceCount = 0;
  let firstDate = null;

  allSessions.forEach(s => {
    // 참석 카운트
    if ((s.attendees || []).some(a => a.alias === selectedAlias)) {
      attendanceCount++;
      if (!firstDate || (s.date && new Date(s.date) < new Date(firstDate))) {
        firstDate = s.date;
      }
    }

    // 기록
    (s.reflections || []).forEach(r => {
      if (r.alias === selectedAlias) {
        entries.push({
          ...r,
          day: s.day,
          date: s.date,
          section: s.section,
          start_page: s.start_page,
          end_page: s.end_page
        });
      }
    });
  });

  // 정렬 방향에 따라 (1차: day, 2차: timestamp)
  if (currentSort === 'oldest') {
    entries.sort((a, b) => {
      const dayDiff = (Number(a.day) || 0) - (Number(b.day) || 0);
      if (dayDiff !== 0) return dayDiff;
      const ta = a.timestamp || '', tb = b.timestamp || '';
      return ta < tb ? -1 : ta > tb ? 1 : 0;
    });
  } else {
    entries.sort((a, b) => {
      const dayDiff = (Number(b.day) || 0) - (Number(a.day) || 0);
      if (dayDiff !== 0) return dayDiff;
      const ta = a.timestamp || '', tb = b.timestamp || '';
      return tb < ta ? -1 : tb > ta ? 1 : 0;
    });
  }

  // 메타
  const metaParts = [];
  metaParts.push(`기록 ${entries.length}개`);
  if (attendanceCount > 0) metaParts.push(`참석 ${attendanceCount}회`);
  document.getElementById('selectedMeta').textContent = metaParts.join(' · ');

  // 다운로드 버튼: 기록이 1개 이상일 때만 표시
  const dlBtn = document.getElementById('memberDownloadBtn');
  if (dlBtn) {
    dlBtn.style.display = entries.length > 0 ? 'inline-flex' : 'none';
  }

  // .md 다운로드 버튼: 기록이 1개 이상일 때만 표시
  const dlMdBtn = document.getElementById('memberDownloadMdBtn');
  if (dlMdBtn) {
    dlMdBtn.style.display = entries.length > 0 ? 'inline-flex' : 'none';
  }

  // 정렬 토글: 기록이 2개 이상일 때만 표시 (1개면 정렬할 게 없음)
  const sortToggle = document.getElementById('sortToggle');
  if (sortToggle) {
    sortToggle.style.display = entries.length >= 2 ? 'flex' : 'none';
    sortToggle.querySelectorAll('.sort-btn').forEach(btn => {
      btn.classList.toggle('current', btn.dataset.sort === currentSort);
    });
  }

  // entries를 함수 밖에서 접근 가능하게 전역에 저장
  window._currentMemberEntries = entries;

  // 엔트리 렌더
  const listEl = document.getElementById('entriesList');
  if (entries.length === 0) {
    listEl.innerHTML = `
      <div class="empty-state">
        <strong>${escapeHtml(selectedAlias)}</strong>
        아직 ${escapeHtml(selectedAlias)}이(가) 남긴 기록이 없어.<br>
        <a href="journal_17.html" style="color: var(--accent); border-bottom: 1px solid var(--accent);">일지 페이지로 가서 첫 한 줄 남기기 →</a>
      </div>`;
    return;
  }

  listEl.innerHTML = entries.map(e => renderEntry(e)).join('');
}

// ════════════════════════════════════════════════════════
// 유틸
// ════════════════════════════════════════════════════════
function formatSessionDate(iso) {
  if (!iso) return { date: '', weekday: '' };
  const d = new Date(iso);
  if (isNaN(d.getTime())) return { date: String(iso), weekday: '' };
  return {
    date: `${d.getMonth() + 1}월 ${d.getDate()}일`,
    weekday: WEEKDAYS[d.getDay()]
  };
}

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function escapeAttr(s) {
  return escapeHtml(s).replace(/'/g, '\\\'');
}

// 사용자 텍스트의 앞뒤 공백·빈 줄을 정리하고
// 가운데에 3줄 이상 연속된 빈 줄은 1줄(=빈 줄 1개)로 정리
function cleanText(s) {
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/\r\n/g, '\n')
    .replace(/[ \t]+\n/g, '\n')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

async function captureElement(html, bgColor) {
  bgColor = bgColor || '#ffffff';
  const wrapper = document.createElement('div');
  wrapper.style.position = 'fixed';
  wrapper.style.left = '-9999px';
  wrapper.style.top = '0';
  wrapper.style.width = '700px';
  wrapper.innerHTML = html;
  document.body.appendChild(wrapper);

  if (document.fonts && document.fonts.ready) {
    try { await document.fonts.ready; } catch (e) {}
  }
  await new Promise(r => setTimeout(r, 200));

  const canvas = await html2canvas(wrapper.firstElementChild, {
    scale: 2,
    backgroundColor: bgColor,
    logging: false,
    useCORS: true
  });

  document.body.removeChild(wrapper);
  return canvas;
}

    </div>
  `;
}

function formatTimeShort(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  const mo = d.getMonth() + 1;
  const da = d.getDate();
  const h = String(d.getHours()).padStart(2, '0');
  const mi = String(d.getMinutes()).padStart(2, '0');
  return `${mo}/${da} ${h}:${mi}`;
}

async function downloadEntryImage(entryId) {
  const el = document.getElementById(entryId);
  if (!el) return;
  const day = Number(el.dataset.day);
  const timestamp = el.dataset.timestamp;

  // 해당 entry 찾기
  const entry = (window._currentMemberEntries || []).find(e =>
    Number(e.day) === day && e.timestamp === timestamp
  );
  if (!entry) return;

  const btn = el.querySelector('.entry-download-btn');
  if (btn) { btn.disabled = true; btn.textContent = '…'; }

  try {
    const html = buildPrintableEntry(entry, selectedAlias);
    const canvas = await captureElement(html, '#f7f4ee');

    canvas.toBlob((blob) => {
      if (!blob) throw new Error('이미지 생성 실패');
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `원청_Day${String(day).padStart(2,'0')}_${selectedAlias}.png`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 'image/png');
  } catch (err) {
    console.error(err);
    alert('이미지 저장 실패: ' + err.message);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '⬇'; }
  }
}

// ─────────────── 멤버 Markdown 다운로드 (시즌 전체) ───────────────

function buildMemberMarkdown(alias, entries) {
  const lines = [];
  lines.push(`# 원청 — ${alias}의 독서와 마음 기록`);
  lines.push('');
  lines.push(`> *文城 · City of Fiction*`);
  lines.push(`>`);
  lines.push(`> 책과 마음 읽기 ${entries.length}개`);
  lines.push('');
  lines.push('---');
  lines.push('');

  entries.forEach((e, idx) => {
    const dateInfo = formatSessionDate(e.date);
    const sectionLabel = SECTION_LABELS[e.section] || '';
    const pageInfo = e.end_page ? `p. ${e.start_page} ~ p. ${e.end_page}` : `p. ${e.start_page}`;

    // 챕터 매칭 (본문 회차일 때만) — buildPrintableEntry와 동일한 로직
    let chapterNum = '';
    let chapterTitle = '';
    if (e.section === 'main' && contents.length > 0) {
      const startNum = parseInt(e.start_page, 10);
      const endNum = parseInt(e.end_page, 10) || startNum;
      if (!isNaN(startNum)) {
        const matches = contents.filter(c =>
          c.section_type === 'main' &&
          Number(c.page_start) <= endNum &&
          Number(c.page_end) >= startNum
        );
        if (matches.length === 1) {
          chapterNum = `Chapter ${matches[0].num}`;
          chapterTitle = matches[0].title || '';
        } else if (matches.length > 1) {
          chapterNum = `Chapter ${matches[0].num} → ${matches[matches.length - 1].num}`;
        }
      }
    }

    // 챕터 라인
    const headerParts = [];
    if (chapterNum) headerParts.push(chapterNum);
    else if (sectionLabel) headerParts.push(sectionLabel);
    if (chapterTitle) headerParts.push(chapterTitle);
    const chapterLine = headerParts.join('. ');

    lines.push(`## Day ${String(e.day).padStart(2,'0')} · ${dateInfo.date} ${dateInfo.weekday}`);
    lines.push('');
    if (chapterLine) {
      lines.push(`**${chapterLine}**  `);
    }
    lines.push(pageInfo);
    lines.push('');

    if (e.quote_text) {
      lines.push(`### 📜 담아두고 싶은 문장`);
      lines.push('');
      const quoteLines = cleanText(e.quote_text).split('\n');
      quoteLines.forEach(ql => lines.push(`> ${ql}`));
      lines.push('>');
      lines.push(`> — ${BOOK_AUTHOR} 『${BOOK_TITLE}』${e.quote_page ? ` · p. ${e.quote_page}` : ''}`);
      lines.push('');
    }

    if (e.my_mind) {
      lines.push(`### ✿ 남기고 싶은 나의 마음`);
      lines.push('');
      lines.push(cleanText(e.my_mind));
      lines.push('');
    }

    if (idx < entries.length - 1) {
      lines.push('---');
      lines.push('');
    }
  });

  lines.push('');
  lines.push('---');
  lines.push('');
  lines.push(`*READING · ALOUD · TOGETHER*  `);
  lines.push(`*모두의 새벽 + 낭만북클럽 · 『원청 (文城)』 & 낭독 모임 후 기록*  `);
  lines.push(`*bookclub.questionschool.net*`);
  lines.push('');

  return lines.join('\n');
}

function downloadMemberMarkdown() {
  const rawEntries = window._currentMemberEntries || [];
  if (rawEntries.length === 0 || !selectedAlias) {
    alert('아직 기록이 없어.');
    return;
  }

  // PDF와 동일하게 오래된 기록부터 정렬 (시간 흐름대로 읽기 좋게)
  const entries = [...rawEntries].sort((a, b) =>
    (Number(a.day) || 0) - (Number(b.day) || 0)
  );

  const btn = document.getElementById('memberDownloadMdBtn');
  const originalHtml = btn ? btn.innerHTML : '';
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<span>⏳</span><span>저장 중…</span>';
  }

  try {
    const md = buildMemberMarkdown(selectedAlias, entries);
    const today = getTodayStr();
    const filename = `원청_${selectedAlias}_기록_${today}.md`;

    const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    console.error(err);
    alert('마크다운 저장 실패: ' + err.message);
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = originalHtml; }
  }
}

// ─────────────── 멤버 PDF 다운로드 (시즌 전체) ───────────────

async function downloadMemberPdf() {
  const rawEntries = window._currentMemberEntries || [];
  if (rawEntries.length === 0 || !selectedAlias) {
    alert('아직 기록이 없어.');
    return;
  }

  // PDF는 항상 오래된 기록부터 정렬 (시간 흐름대로 읽기 좋게)
  const entries = [...rawEntries].sort((a, b) =>
    (Number(a.day) || 0) - (Number(b.day) || 0)
  );

  const btn = document.getElementById('memberDownloadBtn');
  const originalHtml = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span>⏳</span><span>PDF 만드는 중…</span>';

  try {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    const pageWidthMm = 210;
    const pageHeightMm = 297;
    const continuedPageTopMm = 14;        // 새 페이지 시작 시 위쪽 여유
    const usableHeightMm = pageHeightMm - 14;

    // 블록 목록
    const blocks = [];
    blocks.push({ kind: 'header', html: buildMemberHeaderBlock(selectedAlias, entries) });
    entries.forEach(e => {
      blocks.push({ kind: 'entry', html: buildMemberEntryBlock(e) });
    });
    blocks.push({ kind: 'watermark', html: buildMemberWatermarkBlock() });

    // 캡쳐
    const captured = [];
    for (let i = 0; i < blocks.length; i++) {
      const b = blocks[i];
      btn.innerHTML = `<span>⏳</span><span>${i+1}/${blocks.length} 처리 중…</span>`;
      const canvas = await captureElement(b.html);
      const heightMm = (canvas.height * pageWidthMm) / canvas.width;
      captured.push({
        kind: b.kind,
        canvas,
        heightMm,
        imgData: canvas.toDataURL('image/jpeg', 0.92)
      });
    }

    // 배치
    let currentY = 0;
    let isFirstPage = true;

    for (const block of captured) {
      if (block.kind === 'watermark') {
        if (currentY + block.heightMm > usableHeightMm) {
          pdf.addPage();
          currentY = continuedPageTopMm;
        }
        const watermarkY = pageHeightMm - block.heightMm - 4;
        pdf.addImage(block.imgData, 'JPEG', 0, Math.max(currentY, watermarkY), pageWidthMm, block.heightMm);
        currentY = pageHeightMm;
        continue;
      }

      if (!isFirstPage && currentY + block.heightMm > usableHeightMm) {
        pdf.addPage();
        currentY = continuedPageTopMm;
      }
      isFirstPage = false;

      // 페이지보다 큰 단일 블록은 슬라이스 (드물 거지만)
      if (block.heightMm > usableHeightMm) {
        if (currentY > 0) {
          pdf.addPage();
          currentY = continuedPageTopMm;
        }
        let yOffset = 0;
        while (yOffset < block.heightMm) {
          if (yOffset > 0) pdf.addPage();
          pdf.addImage(block.imgData, 'JPEG', 0, currentY - yOffset, pageWidthMm, block.heightMm);
          yOffset += pageHeightMm;
        }
        currentY = pageHeightMm;
        continue;
      }

      pdf.addImage(block.imgData, 'JPEG', 0, currentY, pageWidthMm, block.heightMm);
      currentY += block.heightMm;
    }

    const today = getTodayStr();
    pdf.save(`원청_${selectedAlias}_기록_${today}.pdf`);
  } catch (err) {
    console.error(err);
    alert('PDF 저장 실패: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = originalHtml;
  }
}

function getTodayStr() {
  const d = new Date();
  return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
}
