<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모두의 새벽 + 낭만북클럽</title>
<meta name="description" content="함께 소리내어 책을 읽는 여기, 그리고 지금.">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:title" content="모두의 새벽 + 낭만북클럽">
<meta property="og:description" content="함께 소리내어 책을 읽는 여기, 그리고 지금.">
<meta property="og:image" content="https://bookclub.questionschool.net/images/og_image.jpg">
<meta property="og:url" content="https://bookclub.questionschool.net/">
<meta property="og:site_name" content="모두의 새벽 + 낭만북클럽">
<meta property="og:locale" content="ko_KR">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

<style>
  :root {
    --ink: #2a2520;
    --ink-soft: #5a4d40;
    --ink-light: #8a7a6a;
    --paper: #faf5ea;
    --paper-warm: #f4ede0;
    --rose: #c47b73;
    --rose-light: #d4928a;
    --gold: #c89968;
    --line: rgba(74, 63, 53, 0.12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    font-family: 'Gowun Batang', serif;
    color: var(--ink);
    background: var(--paper);
    line-height: 1.85;
    font-size: 16px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(212, 146, 138, 0.06) 0%, transparent 50%),
      radial-gradient(circle at 85% 80%, rgba(200, 153, 104, 0.06) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  main {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4rem 1.5rem 3rem;
  }

  .hero {
    max-width: 560px;
    text-align: center;
  }

  .eyebrow {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 0.85rem;
    letter-spacing: 0.35em;
    color: var(--rose);
    text-transform: uppercase;
    margin-bottom: 2rem;
    opacity: 0;
    animation: fadeUp 1s ease 0.2s forwards;
  }

  h1 {
    font-family: 'Nanum Myeongjo', serif;
    font-weight: 800;
    font-size: clamp(2rem, 6vw, 3rem);
    line-height: 1.3;
    color: var(--ink);
    margin-bottom: 1.2rem;
    letter-spacing: -0.01em;
    opacity: 0;
    animation: fadeUp 1s ease 0.5s forwards;
  }
  h1 .amp {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-style: italic;
    color: var(--rose);
    margin: 0 0.2em;
  }

  .tagline {
    font-family: 'Nanum Myeongjo', serif;
    font-size: 1.05rem;
    color: var(--ink-soft);
    margin-bottom: 0.3rem;
    opacity: 0;
    animation: fadeUp 1s ease 0.8s forwards;
  }

  .ornament {
    color: var(--gold);
    letter-spacing: 0.5em;
    font-size: 0.9rem;
    margin: 2.5rem 0 2.5rem;
    opacity: 0;
    animation: fadeUp 1s ease 1.1s forwards;
  }

  .journal-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.7rem;
    padding: 1rem 2.4rem;
    background: var(--ink);
    color: var(--paper);
    text-decoration: none;
    font-family: 'Nanum Myeongjo', serif;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0.03em;
    border: 1px solid var(--ink);
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
    opacity: 0;
    animation: fadeUp 1s ease 1.7s forwards;
  }
  .journal-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--rose);
    transform: translateY(100%);
    transition: transform 0.3s ease;
    z-index: -1;
  }
  .journal-btn:hover {
    border-color: var(--rose);
  }
  .journal-btn:hover::before {
    transform: translateY(0);
  }
  .journal-btn .arrow {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    transition: transform 0.3s ease;
  }
  .journal-btn:hover .arrow {
    transform: translateX(4px);
  }

  .now-reading {
    margin-top: 2rem;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 0.9rem;
    color: var(--ink-light);
    letter-spacing: 0.15em;
    opacity: 0;
    animation: fadeUp 1s ease 2s forwards;
  }
  .now-reading .season-no {
    color: var(--rose);
    letter-spacing: 0.25em;
  }

  /* 시즌 이미지 */
  .season-image {
    margin-top: 0.5rem;
    margin-bottom: 2.5rem;
    max-width: 320px;
    margin-left: auto;
    margin-right: auto;
    opacity: 0;
    animation: fadeUp 1.2s ease 1.4s forwards;
  }
  .season-image img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 4px;
    box-shadow: 0 14px 36px rgba(74, 63, 53, 0.16);
  }
  .season-image-caption {
    margin-top: 1.2rem;
    font-family: 'Nanum Myeongjo', serif;
    font-size: 0.95rem;
    color: var(--ink-soft);
    line-height: 1.7;
  }

  .sub-links {
    margin-top: 3.5rem;
    display: flex;
    justify-content: center;
    gap: 1.5rem;
    flex-wrap: wrap;
    opacity: 0;
    animation: fadeUp 1s ease 2.3s forwards;
  }
  .sub-links a {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 0.92rem;
    color: var(--ink-light);
    text-decoration: none;
    letter-spacing: 0.05em;
    transition: color 0.3s ease;
    padding-bottom: 2px;
    border-bottom: 1px solid transparent;
  }
  .sub-links a:hover {
    color: var(--rose);
    border-bottom-color: var(--rose);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  footer {
    position: relative;
    z-index: 1;
    padding: 2rem 1.5rem 2.5rem;
    text-align: center;
    border-top: 1px solid var(--line);
    background: var(--paper-warm);
  }

  .footer-motto {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 0.8rem;
    color: var(--rose);
    letter-spacing: 0.3em;
    margin-bottom: 1rem;
  }

  .footer-contact {
    font-family: 'Nanum Myeongjo', serif;
    font-size: 0.88rem;
    color: var(--ink-soft);
    line-height: 1.9;
  }
  .footer-contact a {
    color: var(--ink-soft);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: all 0.3s ease;
  }
  .footer-contact a:hover {
    color: var(--rose);
    border-bottom-color: var(--rose);
  }
  .footer-contact .divider {
    color: var(--ink-light);
    margin: 0 0.5rem;
    opacity: 0.5;
  }

  @media (max-width: 600px) {
    main {
      padding: 3rem 1.5rem 2rem;
    }
    h1 { font-size: 1.9rem; }
    .tagline { font-size: 0.98rem; }
    .journal-btn { padding: 0.9rem 2rem; font-size: 0.95rem; }
    .season-image { max-width: 100%; margin-top: 2.5rem; }
    .season-image-caption { font-size: 0.9rem; }
    .sub-links { gap: 1.2rem; }
    .sub-links a { font-size: 0.88rem; }
    .footer-contact .divider { display: none; }
    .footer-contact a { display: block; }
  }
</style>
</head>
<body>

<main>
  <div class="hero">
    <div class="eyebrow">Hour of the Heart</div>

    <h1>모두의 새벽<span class="amp">+</span>낭만북클럽</h1>
<br>
    <p class="tagline">여기, 그리고 지금</p>
<br>
    <p class="tagline">매일 아침 함께 모여</p>
    <p class="tagline">소리내어 천천히 책을 읽고</p>
    <p class="tagline">서로의 목소리에 귀를 기울이는</p>
    <p class="tagline">낭독 커뮤니티</p>
    

    <div class="ornament">· · ·</div>

    <div class="season-image">
      <img src="images/hosts_together.png" alt="얄롬의 책으로 15번째 낭독 모임이 진행 중입니다">
      <p class="season-image-caption">얄롬의 책으로 15번째 낭독 모임이 진행 중입니다.</p>
    </div>

    <a href="journal_15.html" class="journal-btn">
      📖 오늘의 독서노트 바로가기
      <span class="arrow">→</span>
    </a>

    <div class="now-reading">
      <span class="season-no">Season 15</span> · 어빈 얄롬 『마음의 시간』
    </div>

    <div class="sub-links">
      <a href="apply_15.html">하단의 15기 모집 안내문 보기 →</a>
      <a href="history.html">그동안 함께 읽어온 책 →</a>
    </div>
  </div>
</main>

<footer>
  <div class="footer-motto">READING · ALOUD · TOGETHER</div>
  <div class="footer-contact">
    <a href="mailto:thomas@questionschool.net">thomas@questionschool.net</a>
    <span class="divider">·</span>
    <a href="https://questionschool.net" target="_blank" rel="noopener noreferrer">questionschool.net</a>
  </div>
</footer>

</body>
</html>
