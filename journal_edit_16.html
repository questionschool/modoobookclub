<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이마고 · 낭독 회차 관리 · 진행자 전용</title>
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Serif+KR:wght@400;500&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root {
    --cream: #ecf4f9;
    --cream-deep: #d8e7f0;
    --cream-soft: #f5fafd;
    --ink: #1a2837;
    --ink-soft: #2f4759;
    --ink-muted: #5e7185;
    --ink-faint: #8a9bab;
    --gold: #2a8499;
    --gold-deep: #1c6577;
    --gold-soft: #5fabbd;
    --line: #c5d4de;
    --line-soft: #dde7ed;
    --accent: #155b80;
    --accent-soft: #2a7aa3;
    --success: #6b8e5a;
    --error: #b54c3e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--cream);
    color: var(--ink);
    font-family: 'Noto Serif KR', 'Gowun Batang', serif;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    background-image:
      radial-gradient(at 15% 10%, rgba(42, 132, 153, 0.06) 0px, transparent 50%),
      radial-gradient(at 85% 90%, rgba(21, 91, 128, 0.05) 0px, transparent 50%);
    background-attachment: fixed;
    min-height: 100vh;
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  /* ============ HEADER ============ */
  header {
    text-align: center;
    padding: 20px 0 30px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 40px;
  }

  .eyebrow {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 13px;
    letter-spacing: 0.25em;
    color: var(--gold-deep);
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  h1 {
    font-family: 'Nanum Myeongjo', serif;
    font-weight: 800;
    font-size: 26px;
    color: var(--ink);
    margin-bottom: 8px;
  }

  h1 .accent { color: var(--accent); }

  .subtitle {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 15px;
    color: var(--ink-muted);
  }

  /* ============ GATE ============ */
  .gate {
    background: rgba(245, 250, 253, 0.7);
    border: 1px solid var(--line);
    padding: 36px 32px;
    text-align: center;
    border-radius: 2px;
  }

  .gate-icon {
    font-size: 24px;
    color: var(--gold);
    margin-bottom: 14px;
  }

  .gate p {
    font-family: 'Gowun Batang', serif;
    font-size: 15px;
    color: var(--ink-soft);
    margin-bottom: 22px;
  }

  .gate input {
    width: 100%;
    max-width: 360px;
    padding: 12px 16px;
    border: 1px solid var(--line);
    background: var(--cream-soft);
    font-family: 'Noto Serif KR', serif;
    font-size: 15px;
    color: var(--ink);
    margin-bottom: 14px;
    border-radius: 2px;
    text-align: center;
    letter-spacing: 0.05em;
  }

  .gate input:focus {
    outline: none;
    border-color: var(--accent);
  }

  .gate button {
    padding: 10px 28px;
    background: var(--accent);
    color: var(--cream-soft);
    border: none;
    font-family: 'Nanum Myeongjo', serif;
    font-size: 14px;
    letter-spacing: 0.1em;
    cursor: pointer;
    border-radius: 2px;
  }

  .gate button:hover { background: var(--accent-soft); }
  .gate button:disabled { opacity: 0.5; cursor: not-allowed; }

  .gate-message {
    margin-top: 16px;
    font-family: 'Gowun Batang', serif;
    font-size: 13px;
    min-height: 20px;
    color: var(--ink-muted);
  }
  .gate-message.error { color: var(--error); }
  .gate-message.checking {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    color: var(--gold-deep);
  }

  /* ============ TOOLBAR ============ */
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
    padding: 14px 18px;
    background: rgba(245, 250, 253, 0.5);
    border: 1px solid var(--line-soft);
    border-radius: 2px;
    gap: 12px;
    flex-wrap: wrap;
  }

  .toolbar-info {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 13px;
    color: var(--ink-muted);
    letter-spacing: 0.1em;
  }

  .toolbar-actions {
    display: flex;
    gap: 8px;
  }

  .btn-link {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 13px;
    color: var(--ink-muted);
    text-decoration: none;
    padding: 4px 10px;
    border: 1px solid transparent;
    border-radius: 2px;
    transition: all 0.2s;
  }

  .btn-link:hover {
    color: var(--accent);
    border-color: var(--line);
  }

  /* ============ FORM ============ */
  .form-card {
    background: rgba(245, 250, 253, 0.6);
    border: 1px solid var(--line-soft);
    border-left: 3px solid var(--gold);
    padding: 28px 30px;
    border-radius: 2px;
    margin-bottom: 24px;
  }

  .field {
    margin-bottom: 22px;
  }

  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 22px;
  }

  .field-row .field { margin-bottom: 0; }

  label {
    display: block;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 12px;
    letter-spacing: 0.18em;
    color: var(--gold-deep);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  label .ko {
    font-family: 'Nanum Myeongjo', serif;
    font-style: normal;
    font-size: 13px;
    color: var(--ink-soft);
    letter-spacing: 0;
    margin-left: 6px;
  }

  label .hint {
    display: block;
    font-family: 'Gowun Batang', serif;
    font-style: normal;
    font-size: 11px;
    color: var(--ink-faint);
    letter-spacing: 0;
    margin-top: 2px;
    text-transform: none;
  }

  input[type="text"],
  input[type="date"],
  select,
  textarea {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--line);
    background: var(--cream-soft);
    font-family: 'Noto Serif KR', 'Gowun Batang', serif;
    font-size: 14.5px;
    color: var(--ink);
    border-radius: 2px;
    transition: border-color 0.2s;
  }

  textarea {
    min-height: 90px;
    resize: vertical;
    line-height: 1.7;
    font-family: 'Gowun Batang', serif;
  }

  textarea.large { min-height: 140px; }

  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
    background: #fff;
  }

  /* ============ ATTENDEE TOGGLES ============ */
  .attendee-toggles {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .attendee-toggle {
    padding: 5px 14px;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 100px;
    font-family: 'Gowun Batang', serif;
    font-size: 13px;
    color: var(--ink-muted);
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
  }

  .attendee-toggle:hover {
    border-color: var(--gold);
    color: var(--ink-soft);
  }

  .attendee-toggle.on {
    background: rgba(42, 132, 153, 0.15);
    border-color: var(--gold);
    color: var(--accent);
    font-weight: 700;
  }

  .attendee-toggle.lead.on {
    background: rgba(21, 91, 128, 0.12);
    border-color: var(--accent);
  }

  .attendee-add {
    display: flex;
    gap: 6px;
    margin-top: 10px;
  }

  .attendee-add input {
    flex: 1;
    padding: 6px 12px;
    font-size: 13px;
  }

  .attendee-add button {
    padding: 6px 14px;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 2px;
    font-family: 'Gowun Batang', serif;
    font-size: 13px;
    color: var(--ink-soft);
    cursor: pointer;
  }

  .attendee-add button:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ============ PAGE SECTION ============ */
  .page-section-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    align-items: end;
  }

  /* ============ CHAPTER HINT ============ */
  .chapter-hint {
    margin-top: 8px;
    padding: 8px 12px;
    background: rgba(42, 132, 153, 0.08);
    border-left: 2px solid var(--gold-soft);
    font-family: 'Gowun Batang', serif;
    font-size: 12.5px;
    color: var(--ink-muted);
    border-radius: 2px;
    min-height: 32px;
  }

  .chapter-hint.empty {
    color: var(--ink-faint);
    font-style: italic;
  }

  /* ============ SUBMIT ============ */
  .submit-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 30px;
    padding-top: 24px;
    border-top: 1px dashed var(--line);
    flex-wrap: wrap;
    gap: 12px;
  }

  .submit-info {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 13px;
    color: var(--ink-muted);
  }

  button.primary {
    padding: 11px 28px;
    background: var(--accent);
    color: var(--cream-soft);
    border: none;
    font-family: 'Nanum Myeongjo', serif;
    font-size: 14.5px;
    font-weight: 700;
    letter-spacing: 0.08em;
    cursor: pointer;
    border-radius: 2px;
    transition: background 0.2s;
  }

  button.primary:hover:not(:disabled) {
    background: var(--accent-soft);
  }

  button.primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .status {
    margin-top: 18px;
    padding: 12px 16px;
    font-family: 'Gowun Batang', serif;
    font-size: 14px;
    border-radius: 2px;
    display: none;
  }

  .status.show { display: block; }
  .status.success { background: rgba(107, 142, 90, 0.12); color: var(--success); border: 1px solid rgba(107, 142, 90, 0.3); }
  .status.error { background: rgba(181, 76, 62, 0.1); color: var(--error); border: 1px solid rgba(181, 76, 62, 0.3); }

  /* ============ EXISTING SESSIONS LIST ============ */
  .existing-list {
    margin-top: 40px;
  }

  .existing-title {
    font-family: 'Nanum Myeongjo', serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--line-soft);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .existing-title .count {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 13px;
    color: var(--ink-muted);
    font-weight: 400;
  }

  .existing-row {
    display: grid;
    grid-template-columns: 60px 1fr auto;
    gap: 14px;
    align-items: center;
    padding: 12px 14px;
    background: rgba(245, 250, 253, 0.4);
    border: 1px solid var(--line-soft);
    border-radius: 2px;
    margin-bottom: 8px;
    transition: background 0.15s;
  }

  .existing-row:hover {
    background: rgba(245, 250, 253, 0.8);
  }

  .existing-day {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 16px;
    color: var(--gold-deep);
    text-align: center;
  }

  .existing-info {
    font-family: 'Gowun Batang', serif;
    font-size: 13px;
    color: var(--ink-soft);
  }

  .existing-info .pages {
    color: var(--accent);
    font-weight: 700;
    margin-right: 8px;
  }

  .existing-actions {
    display: flex;
    gap: 6px;
  }

  .existing-actions button {
    padding: 4px 10px;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 2px;
    font-family: 'Gowun Batang', serif;
    font-size: 12px;
    color: var(--ink-soft);
    cursor: pointer;
  }

  .existing-actions button:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .existing-actions button.danger:hover {
    border-color: var(--error);
    color: var(--error);
  }

  .empty {
    text-align: center;
    padding: 30px;
    color: var(--ink-muted);
    font-style: italic;
    font-family: 'Cormorant Garamond', serif;
  }

  @media (max-width: 640px) {
    .wrap { padding: 30px 16px 60px; }
    .form-card { padding: 22px 18px; }
    .field-row { grid-template-columns: 1fr; gap: 0; }
    .field-row .field { margin-bottom: 22px; }
    .page-section-grid { grid-template-columns: 1fr; }
    .existing-row { grid-template-columns: 50px 1fr; }
    .existing-actions { grid-column: 2; }
  }
</style>
<!-- PDF/이미지 생성 라이브러리 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</head>
<body>

<div class="wrap">

  <header>
    <div class="eyebrow">Season 16 · Editor</div>
    <h1><span class="accent">이마고</span> — 낭독 회차 관리</h1>
    <p class="subtitle">A space only the hosts walk into.</p>
  </header>

  <!-- ============ GATE (키 없을 때) ============ -->
  <div id="gateView" class="gate" style="display:none;">
    <div class="gate-icon">✦</div>
    <p>진행자 전용 페이지야. 입력 키를 적어 줘.</p>
    <input type="password" id="gateKey" placeholder="입력 키" autocomplete="off"
           onkeydown="if(event.key==='Enter'){enterGate();event.preventDefault();}">
    <br>
    <button id="gateBtn" onclick="enterGate()">들어가기 →</button>
    <div id="gateMessage" class="gate-message"></div>
  </div>

  <!-- ============ EDITOR (키 통과 시) ============ -->
  <div id="editorView" style="display:none;">

    <div class="toolbar">
      <span class="toolbar-info" id="toolbarInfo">불러오는 중…</span>
      <div class="toolbar-actions">
        <a href="journal_16.html" class="btn-link">📖 오늘 기록</a>
        <a href="my_journal_16.html" class="btn-link">✿ 나의 기록</a>
        <a href="contents_16.html" class="btn-link">📋 진행 상황</a>
        <a href="#" class="btn-link" onclick="logout(); return false;">🔒 잠그기</a>
      </div>
    </div>

    <!-- ============ FORM ============ -->
    <div class="form-card">
      <input type="hidden" id="editDay" value="">

      <div class="field-row">
        <div class="field">
          <label>Day <span class="ko">· 회차 번호</span></label>
          <input type="number" id="fDay" min="1" max="40" placeholder="1, 2, 3…">
        </div>
        <div class="field">
          <label>Date <span class="ko">· 날짜</span></label>
          <input type="date" id="fDate">
        </div>
      </div>

      <div class="field">
        <label>Pages <span class="ko">· 시작과 끝 페이지</span><span class="hint">모임 전에는 시작 페이지만, 모임 끝난 뒤 끝 페이지를 추가하면 돼.</span></label>
        <div class="page-section-grid">
          <input type="number" id="fStartPage" placeholder="시작 페이지 (예: 79)" oninput="updateChapterHint()" min="1">
          <input type="number" id="fEndPage" placeholder="끝 페이지 (모임 후 입력)" oninput="updateChapterHint()" min="1">
        </div>
        <div class="chapter-hint empty" id="chapterHint">페이지를 입력하면 어떤 챕터에 해당하는지 보여줘.</div>
      </div>

      <div class="field">
        <label>Leader <span class="ko">· 진행자</span></label>
        <input type="text" id="fLeader" placeholder="농담 / 지평 / 농담 & 지평">
      </div>

      <div class="field">
        <label>Attendees <span class="ko">· 함께한 사람들</span><span class="hint">탭하면 토글돼. 진행자는 두 번 탭하면 진행자로 표시.</span></label>
        <div class="attendee-toggles" id="attendeeToggles"></div>
        <div class="attendee-add">
          <input type="text" id="newAttendee" placeholder="새 별칭 추가" onkeydown="if(event.key==='Enter'){addAttendee();event.preventDefault();}">
          <button onclick="addAttendee()">+ 추가</button>
        </div>
      </div>

      <div class="field">
        <label>Reading Note <span class="ko">· 읽은 이야기</span></label>
        <textarea id="fReadingNote" placeholder="이번 회차에 어디를 어떤 결로 읽었는지 짧게…"></textarea>
      </div>

      <div class="field">
        <label>Question <span class="ko">· 함께 나눌 질문</span><span class="hint">진행자 전용 메모 · 참가자에게는 보이지 않아.</span></label>
        <textarea id="fQuoteText" placeholder="다음 모임에서 함께 나눠보고 싶은 질문…"></textarea>
      </div>

      <div class="field">
        <label>Fellow Travelers <span class="ko">· 참가자 관련 메모</span><span class="hint">진행자 전용 메모 · 참가자에게는 보이지 않아.</span></label>
        <textarea id="fQuoteMeta" placeholder="오늘 멤버들의 상태, 기억해둘 이야기…"></textarea>
      </div>

      <div class="field">
        <label>Sharing Note <span class="ko">· 나눈 이야기</span></label>
        <textarea id="fSharing" class="large" placeholder="30분간의 나눔에서 어떤 이야기가 오갔는지…"></textarea>
      </div>

      <div class="submit-row">
        <span class="submit-info" id="formMode">새 회차 추가</span>
        <div>
          <button class="primary" id="submitBtn" onclick="submitForm()">저장 →</button>
        </div>
      </div>

      <div class="status" id="status"></div>
    </div>

    <!-- ============ EXISTING SESSIONS ============ -->
    <div class="existing-list">
      <div class="existing-title">
        <span>지금까지 기록된 회차</span>
        <span class="count" id="existingCount">—</span>
      </div>
      <div id="existingList">
        <div class="empty">불러오는 중…</div>
      </div>
    </div>

  </div>

</div>

<script>
// ════════════════════════════════════════════════════════
// 설정 — GAS 배포 후 여기에 URL 붙여넣기
// ════════════════════════════════════════════════════════
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyN5Gzjrzvf_hnewWGnFdeQpl0YpSbcR8aRsW8BGQbOsd2_ajsuAkwD228JwyccQj1h/exec';

// 시즌 16 참가자 (가나다 순) — 폼에서 자동 토글 가능
// * 시즌 15에서 이어가는 멤버 기준. 새 멤버는 입력 폼에서 직접 추가 가능
const DEFAULT_MEMBERS = [
  { alias: '농담', lead: true },
  { alias: '목마가렛' },
  { alias: '보나' },
  { alias: '연경' },
  { alias: '자연' },
  { alias: '자유' },
  { alias: '프란체스코' },
  { alias: '지평', lead: true }
];

// ════════════════════════════════════════════════════════
// 상태
// ════════════════════════════════════════════════════════
let editKey = null;
let contents = [];
let sessions = [];
let attendeePool = [];   // [{alias, lead, on}]

// ════════════════════════════════════════════════════════
// 날짜 헬퍼 — 시트가 ISO 문자열로 변환해 보내는 경우 대비
// ════════════════════════════════════════════════════════
// 시트에 텍스트로 저장한 날짜라도, Sheets가 자동으로 Date 객체로 인식하면
// GAS가 JSON으로 직렬화할 때 ISO 문자열("2026-06-03T15:00:00.000Z")로 바뀜.
// <input type="date">는 "yyyy-MM-dd" 형식만 받으므로 변환 필수.
function isoToDateInput(value) {
  if (!value) return '';
  // 이미 "YYYY-MM-DD" 단순 형태면 그대로
  if (typeof value === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(value)) return value;
  // ISO 문자열이면 앞 10자가 yyyy-MM-dd 부분 — Sheets가 보낸 케이스는
  // 시트의 로컬 자정을 UTC로 변환해 둔 형태라 앞 10자가 사용자 입력에 가장 가까움
  if (typeof value === 'string') {
    const m = value.match(/^(\d{4}-\d{2}-\d{2})/);
    if (m) return m[1];
  }
  // 기타 (Date 객체 등) — UTC 기준 yyyy-MM-dd로
  const d = new Date(value);
  if (!isNaN(d.getTime())) {
    const y = d.getUTCFullYear();
    const mo = String(d.getUTCMonth() + 1).padStart(2, '0');
    const da = String(d.getUTCDate()).padStart(2, '0');
    return `${y}-${mo}-${da}`;
  }
  return '';
}

// ════════════════════════════════════════════════════════
// 게이트
// ════════════════════════════════════════════════════════
function getKeyFromUrl() {
  const m = location.search.match(/[?&]key=([^&]+)/);
  return m ? decodeURIComponent(m[1]) : null;
}

async function enterGate() {
  const k = document.getElementById('gateKey').value.trim();
  if (!k) return;

  const btn = document.getElementById('gateBtn');
  if (btn) { btn.disabled = true; btn.textContent = '확인 중…'; }
  setGateMessage('키를 확인하는 중…', 'checking');

  try {
    const result = await verifyKey(k);
    if (result === 'ok') {
      editKey = k;
      sessionStorage.setItem('journal15_key', k);
      setGateMessage('', '');
      showEditor();
    } else if (result === 'invalid') {
      // 키가 명확히 거부됨 — sessionStorage도 정리
      sessionStorage.removeItem('journal15_key');
      setGateMessage('키가 맞지 않아. 다시 확인해 줘.', 'error');
      document.getElementById('gateKey').value = '';
      document.getElementById('gateKey').focus();
    } else {
      // 네트워크/일시 오류 — 키는 일단 받고 들여보내되 안내
      editKey = k;
      sessionStorage.setItem('journal15_key', k);
      setGateMessage('서버 응답이 이상해. 일단 들어가지만, 저장 시 다시 시도해 줘.', 'error');
      setTimeout(() => showEditor(), 800);
    }
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '들어가기 →'; }
  }
}

// GAS 키 검증: 존재하지 않는 day로 delete_session 호출
//   - 키 OK  → GAS는 키 검증 통과 후 deleteSession()에서 false 응답 → { ok: true, deleted: false }
//   - 키 NG  → GAS는 키 검증 단계에서 { ok: false, error: 'Invalid edit key' }
//   - 네트워크 에러 → 'network'
// 데이터에는 영향 없음 (day 0은 존재하지 않으니까).
async function verifyKey(key) {
  try {
    const data = await apiPost({ action: 'delete_session', key: key, day: 0 });
    if (data && data.ok === true) return 'ok';
    if (data && data.error && String(data.error).indexOf('Invalid edit key') !== -1) return 'invalid';
    // 기타 응답 — 보수적으로 network 취급
    return 'network';
  } catch (e) {
    return 'network';
  }
}

function setGateMessage(msg, cls) {
  const el = document.getElementById('gateMessage');
  if (!el) return;
  el.textContent = msg || '';
  el.className = 'gate-message' + (cls ? ' ' + cls : '');
}

function logout() {
  editKey = null;
  sessionStorage.removeItem('journal15_key');
  document.getElementById('editorView').style.display = 'none';
  document.getElementById('gateView').style.display = 'block';
  setGateMessage('', '');
  document.getElementById('gateKey').value = '';
}

function showEditor() {
  document.getElementById('gateView').style.display = 'none';
  document.getElementById('editorView').style.display = 'block';
  initAttendeePool();
  refreshAll();
}

// ════════════════════════════════════════════════════════
// API 호출
// ════════════════════════════════════════════════════════
async function apiGet(action) {
  if (!GAS_URL || GAS_URL.startsWith('PASTE_')) {
    throw new Error('GAS_URL이 아직 설정되지 않았어');
  }
  const res = await fetch(`${GAS_URL}?action=${action}&season=16`);
  return res.json();
}

async function apiPost(body) {
  if (!GAS_URL || GAS_URL.startsWith('PASTE_')) {
    throw new Error('GAS_URL이 아직 설정되지 않았어');
  }
  // 시즌 16 자동 주입 (body에 이미 season이 없을 때만)
  const bodyWithSeason = body.season ? body : Object.assign({ season: '16' }, body);
  const res = await fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(bodyWithSeason)
  });
  return res.json();
}

// ════════════════════════════════════════════════════════

async function refreshAll() {
  try {
    const data = await apiGet('list_all');
    contents = data.contents || [];
    sessions = data.sessions || [];
    document.getElementById('toolbarInfo').textContent =
      `${sessions.length}개 회차 기록됨 · ${contents.length}개 챕터`;
    renderExistingList();
    autofillNewSession();   // 폼이 비어있고 편집 모드 아니면 다음 회차 자동 채우기
    updateChapterHint();
  } catch (err) {
    document.getElementById('toolbarInfo').textContent = '⚠️ 데이터 불러오기 실패';
    console.error(err);
  }
}

// ════════════════════════════════════════════════════════
// 자동 채우기 — 다음 회차의 기본값을 미리 채워줌
//   · Day: 가장 최근 회차 + 1 (없으면 1)
//   · Date: 오늘 (KST 기준 yyyy-MM-dd)
//   · Section: 최근 회차의 섹션 (없으면 'main')
//   · Start Page: 본문→본문 흐름이면 최근 end_page + 1
//
// 단, 편집 모드(editDay 있음)이거나 사용자가 이미 Day를 입력했으면 손대지 않음.
// 사용자는 채워진 값을 자유롭게 수정 가능.
// ════════════════════════════════════════════════════════
function autofillNewSession() {
  // 편집 모드면 손대지 않음
  if (document.getElementById('editDay').value) return;
  // 이미 Day 입력 중이면 손대지 않음
  if (document.getElementById('fDay').value) return;

  // 가장 최근(day 최댓값) 회차 찾기
  const latest = sessions.length > 0
    ? sessions.reduce((a, b) =>
        (Number(b.day) || 0) > (Number(a.day) || 0) ? b : a)
    : null;

  // Day: 최근 회차 + 1, 없으면 1
  const nextDay = latest ? (Number(latest.day) || 0) + 1 : 1;
  document.getElementById('fDay').value = nextDay;

  // Date: 오늘 (KST 기준 yyyy-MM-dd)
  document.getElementById('fDate').value = getTodayKstDateString();

  // Start Page: 본문→본문 흐름이고 최근 회차에 end_page가 있을 때만 자동 계산
  // (서론→본문이나 본문→후기 같은 경계는 사용자가 직접 입력하는 편이 안전)
  if (latest && latest.section === 'main' && latest.end_page) {
    const lastEnd = parseInt(latest.end_page, 10);
    if (!isNaN(lastEnd)) {
      document.getElementById('fStartPage').value = String(lastEnd + 1);
    }
  }

  // 안내 텍스트 갱신
  document.getElementById('formMode').textContent =
    `새 회차 추가 (Day ${nextDay} 기본값 채움)`;
}

// KST 기준 오늘 날짜를 yyyy-MM-dd 형식으로
function getTodayKstDateString() {
  const nowKstMs = Date.now() + 9 * 60 * 60 * 1000;
  const kst = new Date(nowKstMs);
  const y = kst.getUTCFullYear();
  const mo = String(kst.getUTCMonth() + 1).padStart(2, '0');
  const da = String(kst.getUTCDate()).padStart(2, '0');
  return `${y}-${mo}-${da}`;
}

// ════════════════════════════════════════════════════════
// 참석자 풀
// ════════════════════════════════════════════════════════
function initAttendeePool() {
  attendeePool = DEFAULT_MEMBERS.map(m => ({ ...m, on: false }));
  renderAttendees();
}

function renderAttendees() {
  const el = document.getElementById('attendeeToggles');
  el.innerHTML = attendeePool.map((m, i) => `
    <span class="attendee-toggle ${m.on ? 'on' : ''} ${m.lead ? 'lead' : ''}"
          onclick="toggleAttendee(${i})"
          ondblclick="toggleLead(${i})">
      ${escapeHtml(m.alias)}${m.lead ? ' ✦' : ''}
    </span>
  `).join('');
}

function toggleAttendee(i) {
  attendeePool[i].on = !attendeePool[i].on;
  renderAttendees();
}

function toggleLead(i) {
  attendeePool[i].lead = !attendeePool[i].lead;
  renderAttendees();
}

function addAttendee() {
  const input = document.getElementById('newAttendee');
  const alias = input.value.trim();
  if (!alias) return;
  if (attendeePool.find(m => m.alias === alias)) {
    input.value = '';
    return;
  }
  attendeePool.push({ alias, lead: false, on: true });
  input.value = '';
  renderAttendees();
}

// ════════════════════════════════════════════════════════
// 챕터 힌트 (입력한 페이지 범위가 어떤 챕터에 해당하는지)
// ════════════════════════════════════════════════════════
function updateChapterHint() {
  const start = document.getElementById('fStartPage').value.trim();
  const end = document.getElementById('fEndPage').value.trim();
  const hint = document.getElementById('chapterHint');

  if (!start) {
    hint.textContent = '페이지를 입력하면 어떤 챕터에 해당하는지 보여줘.';
    hint.classList.add('empty');
    return;
  }

  const startNum = parseInt(start, 10);
  const endNum = parseInt(end, 10) || startNum;
  if (isNaN(startNum)) {
    hint.textContent = '페이지는 숫자로 입력해 줘 (예: 79)';
    hint.classList.add('empty');
    return;
  }

  // 페이지 범위와 겹치는 챕터를 모두 찾는다 (front · main · back 모두 검색)
  const matches = contents.filter(c =>
    Number(c.page_start) <= endNum &&
    Number(c.page_end) >= startNum
  ).sort((a, b) => Number(a.page_start) - Number(b.page_start));

  if (matches.length === 0) {
    hint.textContent = '해당하는 챕터를 찾지 못했어. 페이지를 확인해 줘.';
    hint.classList.add('empty');
    return;
  }

  // 챕터 라벨
  const labelOf = (c) => {
    if (c.section_type === 'main') return `Ch. ${c.num} 「${c.title}」`;
    return `「${c.title}」`;
  };

  const label = matches.length === 1
    ? labelOf(matches[0])
    : `${labelOf(matches[0])} → ${labelOf(matches[matches.length-1])}`;
  const pageCount = endNum - startNum + 1;
  hint.textContent = `📖 ${label} · ${pageCount}쪽`;
  hint.classList.remove('empty');
}

// 페이지 범위로부터 section_type(front/main/back) 자동 결정
function detectSection(startNum, endNum) {
  const matches = contents.filter(c =>
    Number(c.page_start) <= endNum &&
    Number(c.page_end) >= startNum
  );
  if (matches.length === 0) return 'main';   // 매칭 실패 시 기본값
  matches.sort((a, b) => Number(a.page_start) - Number(b.page_start));
  return matches[0].section_type || 'main';
}

// ════════════════════════════════════════════════════════
// 폼 제출
// ════════════════════════════════════════════════════════
async function submitForm() {
  const day = document.getElementById('fDay').value.trim();
  const date = document.getElementById('fDate').value;
  const startPage = document.getElementById('fStartPage').value.trim();
  const endPage = document.getElementById('fEndPage').value.trim();
  const leader = document.getElementById('fLeader').value.trim();
  const readingNote = document.getElementById('fReadingNote').value.trim();
  const quoteText = document.getElementById('fQuoteText').value.trim();
  const quoteMeta = document.getElementById('fQuoteMeta').value.trim();
  const sharing = document.getElementById('fSharing').value.trim();

  if (!day) return showStatus('Day를 입력해 줘.', 'error');
  if (!date) return showStatus('날짜를 입력해 줘.', 'error');
  if (!startPage) return showStatus('시작 페이지를 입력해 줘.', 'error');

  // 페이지 범위로 section 자동 결정 (front/main/back)
  const startNum = parseInt(startPage, 10);
  const endNum = parseInt(endPage, 10) || startNum;
  const section = detectSection(startNum, endNum);

  const attendees = attendeePool
    .filter(m => m.on)
    .map(m => ({ alias: m.alias, lead: !!m.lead }));

  const payload = {
    day: Number(day),
    date,
    section,
    start_page: startPage,
    end_page: endPage,
    leader,
    attendees,
    reading_note: readingNote,
    quote_text: quoteText,
    quote_meta: quoteMeta,
    sharing
  };

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '저장 중…';

  try {
    const editDay = document.getElementById('editDay').value;
    const action = editDay ? 'update_session' : 'add_session';
    const body = { action, key: editKey, payload };
    if (editDay) body.day = Number(editDay);

    const data = await apiPost(body);
    if (data.ok) {
      showStatus('✦ 저장됐어. 일지 페이지에서 확인할 수 있어.', 'success');
      resetForm();
      await refreshAll();
    } else {
      throw new Error(data.error || 'unknown');
    }
  } catch (err) {
    showStatus('저장에 실패했어: ' + err.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '저장 →';
  }
}

function resetForm() {
  document.getElementById('editDay').value = '';
  document.getElementById('fDay').value = '';
  document.getElementById('fDate').value = '';
  document.getElementById('fStartPage').value = '';
  document.getElementById('fEndPage').value = '';
  document.getElementById('fLeader').value = '';
  document.getElementById('fReadingNote').value = '';
  document.getElementById('fQuoteText').value = '';
  document.getElementById('fQuoteMeta').value = '';
  document.getElementById('fSharing').value = '';
  attendeePool.forEach(m => m.on = false);
  renderAttendees();
  document.getElementById('formMode').textContent = '새 회차 추가';
  updateChapterHint();
  // 폼 비운 직후 다음 회차 기본값 자동 채우기
  autofillNewSession();
}

// ════════════════════════════════════════════════════════
// 기존 회차 목록 / 편집 / 삭제
// ════════════════════════════════════════════════════════
function renderExistingList() {
  const el = document.getElementById('existingList');
  document.getElementById('existingCount').textContent = `${sessions.length}개`;

  if (sessions.length === 0) {
    el.innerHTML = '<div class="empty">아직 기록된 회차가 없어. 첫 회차를 입력해 줘.</div>';
    return;
  }

  el.innerHTML = sessions.map(s => `
    <div class="existing-row">
      <div class="existing-day">Day ${escapeHtml(s.day)}</div>
      <div class="existing-info">
        <span class="pages">p. ${escapeHtml(s.start_page)} ${s.end_page ? '~ p. ' + escapeHtml(s.end_page) : '<span style="font-style:italic; color:var(--ink-muted); font-weight: 400;">(진행 중)</span>'}</span>
        ${escapeHtml(formatDateShort(s.date))} · 진행 ${escapeHtml(s.leader || '?')} · ${(s.attendees || []).length}명
      </div>
      <div class="existing-actions">
        <button onclick="editSession(${s.day})">편집</button>
        <button class="secondary" onclick="downloadAdminPdf(${s.day})" title="진행자 전용 풀 버전 PDF (Question/Fellow Travelers 메모 포함)">📄 PDF</button>
        <button class="secondary" onclick="downloadAdminImage(${s.day})" title="진행자 전용 풀 버전 이미지 (Question/Fellow Travelers 메모 포함)">🖼 이미지</button>
        <button class="danger" onclick="deleteSessionConfirm(${s.day})">삭제</button>
      </div>
    </div>
  `).join('');
}

function editSession(day) {
  const s = sessions.find(x => Number(x.day) === Number(day));
  if (!s) return;

  document.getElementById('editDay').value = s.day;
  document.getElementById('fDay').value = s.day;
  // 날짜: Sheets가 ISO 문자열로 변환해 보낼 수 있으므로 yyyy-MM-dd로 정규화
  document.getElementById('fDate').value = isoToDateInput(s.date);
  document.getElementById('fStartPage').value = s.start_page || '';
  document.getElementById('fEndPage').value = s.end_page || '';
  document.getElementById('fLeader').value = s.leader || '';
  document.getElementById('fReadingNote').value = s.reading_note || '';
  document.getElementById('fQuoteText').value = s.quote_text || '';
  document.getElementById('fQuoteMeta').value = s.quote_meta || '';
  document.getElementById('fSharing').value = s.sharing || '';

  // 참석자 적용: 기존 풀에 있으면 on, 없으면 풀에 추가
  attendeePool.forEach(m => m.on = false);
  (s.attendees || []).forEach(a => {
    let found = attendeePool.find(m => m.alias === a.alias);
    if (!found) {
      found = { alias: a.alias, lead: !!a.lead, on: true };
      attendeePool.push(found);
    } else {
      found.on = true;
      if (a.lead) found.lead = true;
    }
  });
  renderAttendees();

  document.getElementById('formMode').textContent = `Day ${s.day} 편집 중`;
  updateChapterHint();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function deleteSessionConfirm(day) {
  if (!confirm(`Day ${day}을(를) 삭제할까? 되돌릴 수 없어.`)) return;
  try {
    const data = await apiPost({ action: 'delete_session', key: editKey, day: Number(day) });
    if (data.ok) {
      showStatus(`Day ${day} 삭제됨.`, 'success');
      await refreshAll();
    } else {
      throw new Error(data.error || 'unknown');
    }
  } catch (err) {
    showStatus('삭제 실패: ' + err.message, 'error');
  }
}

// ════════════════════════════════════════════════════════
// 유틸
// ════════════════════════════════════════════════════════
function showStatus(msg, type) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = `status show ${type}`;
  if (type === 'success') {
    setTimeout(() => el.className = 'status', 5000);
  }
}

function formatDateShort(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return iso;
  return `${d.getMonth() + 1}/${d.getDate()}`;
}

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

// ════════════════════════════════════════════════════════
// 진입점
// ════════════════════════════════════════════════════════
(async function init() {
  // URL 쿼리 ?key=… 또는 sessionStorage
  const k = getKeyFromUrl() || sessionStorage.getItem('journal15_key');
  if (k) {
    // 저장된 키가 있어도 자동 통과시키지 않고 검증
    document.getElementById('gateView').style.display = 'block';
    setGateMessage('저장된 키를 확인하는 중…', 'checking');

    const result = await verifyKey(k);
    if (result === 'ok') {
      editKey = k;
      sessionStorage.setItem('journal15_key', k);
      setGateMessage('', '');
      showEditor();
      return;
    }
    if (result === 'invalid') {
      // 저장된 키가 실제론 틀린 키 — 정리하고 게이트로
      sessionStorage.removeItem('journal15_key');
      setGateMessage('저장된 키가 더 이상 유효하지 않아. 다시 입력해 줘.', 'error');
      return;
    }
    // network — 검증 못 했으면 일단 들여보내고 저장 시 재검증
    editKey = k;
    sessionStorage.setItem('journal15_key', k);
    setGateMessage('', '');
    showEditor();
    return;
  }
  document.getElementById('gateView').style.display = 'block';
})();

// ════════════════════════════════════════════════════════
// PDF / 이미지 추출 (진행자 전용 풀 버전)
// Question, Fellow Travelers 메모 포함
// ════════════════════════════════════════════════════════

const BOOK_AUTHOR = '헨드릭스·헌트';
const BOOK_TITLE = '이마고 : 당신이 원하는 사랑 만들기';
const SECTION_LABELS = { front: '서론', main: '본문', back: '후기' };

function cleanText(s) {
  if (!s) return '';
  return String(s)
    .replace(/\r\n/g, '\n')
    .replace(/[ \t]+\n/g, '\n')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

function formatTimeShort(timestamp) {
  if (!timestamp) return '';
  const d = new Date(timestamp);
  if (isNaN(d.getTime())) return '';
  const utcMs = d.getTime();
  const kstMs = utcMs + 9 * 60 * 60 * 1000;
  const k = new Date(kstMs);
  const m = String(k.getUTCMonth() + 1);
  const day = String(k.getUTCDate());
  const hh = String(k.getUTCHours()).padStart(2, '0');
  const mm = String(k.getUTCMinutes()).padStart(2, '0');
  return `${m}/${day} ${hh}:${mm}`;
}

function formatSessionDateFull(dateStr) {
  if (!dateStr) return { date: '', weekday: '' };
  // 'YYYY-MM-DD' 형식
  const match = dateStr.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!match) return { date: dateStr, weekday: '' };
  const y = parseInt(match[1], 10);
  const m = parseInt(match[2], 10);
  const d = parseInt(match[3], 10);
  const dt = new Date(Date.UTC(y, m - 1, d));
  const weekdays = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
  return {
    date: `${m}월 ${d}일`,
    weekday: weekdays[dt.getUTCDay()]
  };
}

async function captureElement(html, widthPx, bgColor) {
  widthPx = widthPx || 760;
  bgColor = bgColor || '#ffffff';
  const wrapper = document.createElement('div');
  wrapper.style.position = 'fixed';
  wrapper.style.left = '-9999px';
  wrapper.style.top = '0';
  wrapper.style.width = widthPx + 'px';
  wrapper.innerHTML = html;
  document.body.appendChild(wrapper);

  if (document.fonts && document.fonts.ready) {
    try { await document.fonts.ready; } catch (e) {}
  }
  await new Promise(r => setTimeout(r, 200));

  const canvas = await html2canvas(wrapper.firstElementChild, {
    scale: 2,
    backgroundColor: bgColor,
    logging: false,
    useCORS: true
  });

  document.body.removeChild(wrapper);
  return canvas;
}

// PDF 다운로드 (흰 배경, 인쇄용)
async function downloadAdminPdf(day) {
  const s = sessions.find(x => Number(x.day) === Number(day));
  if (!s) return;

  const btn = event.target;
  const orig = btn.textContent;
  btn.disabled = true;
  btn.textContent = '⏳ 처리 중…';

  try {
    const html = buildAdminFullHtml(s, '#ffffff');
    const canvas = await captureElement(html, 760, '#ffffff');

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    const pageWidthMm = 210;
    const pageHeightMm = 297;
    const marginMm = 14;
    const contentWidthMm = pageWidthMm - marginMm * 2;

    const imgHeightMm = (canvas.height * contentWidthMm) / canvas.width;
    const imgData = canvas.toDataURL('image/png');

    if (imgHeightMm <= pageHeightMm - marginMm * 2) {
      // 한 페이지에 들어감
      pdf.addImage(imgData, 'PNG', marginMm, marginMm, contentWidthMm, imgHeightMm);
    } else {
      // 여러 페이지로 분할
      let positionMm = 0;
      const pageContentHeightMm = pageHeightMm - marginMm * 2;
      const pxPerMm = canvas.width / contentWidthMm;
      while (positionMm < imgHeightMm) {
        if (positionMm > 0) pdf.addPage();
        pdf.addImage(imgData, 'PNG', marginMm, marginMm - positionMm, contentWidthMm, imgHeightMm);
        positionMm += pageContentHeightMm;
      }
    }

    // 파일명: 시트가 ISO로 보낸 경우 대비해 날짜 정규화
    const dateForFilename = isoToDateInput(s.date) || 'unknown';
    const filename = `이마고_Day${String(s.day).padStart(2,'0')}_${dateForFilename}_진행자.pdf`;
    pdf.save(filename);
  } catch (err) {
    console.error(err);
    alert('PDF 생성 실패: ' + (err.message || err));
  } finally {
    btn.disabled = false;
    btn.textContent = orig;
  }
}

// 이미지 다운로드 (크림 배경, 공유용)
async function downloadAdminImage(day) {
  const s = sessions.find(x => Number(x.day) === Number(day));
  if (!s) return;

  const btn = event.target;
  const orig = btn.textContent;
  btn.disabled = true;
  btn.textContent = '⏳ 처리 중…';

  try {
    const html = buildAdminFullHtml(s, '#ecf4f9');
    const canvas = await captureElement(html, 760, '#ecf4f9');

    canvas.toBlob((blob) => {
      if (!blob) throw new Error('이미지 생성 실패');
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      // 파일명: 시트가 ISO로 보낸 경우 대비해 날짜 정규화
      const dateForFilename = isoToDateInput(s.date) || 'unknown';
      a.download = `이마고_Day${String(s.day).padStart(2,'0')}_${dateForFilename}_진행자.png`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      btn.disabled = false;
      btn.textContent = orig;
    });
  } catch (err) {
    console.error(err);
    alert('이미지 생성 실패: ' + (err.message || err));
    btn.disabled = false;
    btn.textContent = orig;
  }
}
